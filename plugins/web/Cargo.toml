[package]
name = "marqdo_plugin_web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Marqdo web plugin (ABI v2) — HTTP, SQLite, page assemble"
publish = false

[lib]
name = "web"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws", "json", "query", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "limit", "set-header", "trace", "propagate-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
argon2 = "0.5"
getrandom = "0.2"
pulldown-cmark = "0.12"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
redis = { version = "0.27", default-features = true }
ureq = { version = "=2.9.7", default-features = false, features = ["tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
