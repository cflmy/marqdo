[package]
name = "marqdo_plugin_llm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Marqdo LLM transport plugin (ABI v2) — OpenAI-compatible chat completions"
publish = false

[lib]
name = "llm"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
# Pin with host (edition2024-safe for rustc 1.81).
ureq = { version = "=2.9.7", default-features = false, features = ["tls", "gzip"] }
idna_adapter = { version = "=1.1.0" }
zeroize = { version = "=1.8.1" }
