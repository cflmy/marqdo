# 生态组件职责与构建关系。精确提交由 Git tree 的 gitlink 锁定。
# 治理树最多两级：根 → 领域聚合（kind = "domain"）→ 功能组件。每个聚合仓库只登记直属子组件，
# 递归展平后全局 ID 与权威远端唯一；禁止在根同时登记某个计划中聚合及其后代路径。
# kind = "domain" 是治理角色：requires = []，release 为 none（普通领域）或 base（Stdlib Bundle 聚合），
# 聚合仓自身不含生产实现；其子组件在领域仓库自己的 components.toml 登记。
# planned 的 requires 是设计输入，激活前须核对实际 imports 和发布依赖。
# 已发布的仓库提交可以作为 planned gitlink 固定，发行验收以 active 状态为准。

[[component]]
id = "cli"
path = "cli"
kind = "core"
state = "active"
owner = "cflmy"
scope = "语言语义、运行时、受控宿主和公共协议"
requires = []
checks_with = ["conformance"]
release = "base"
entry = "tools/release/smoke.py"

[[component]]
id = "conformance"
path = "tests/conformance"
kind = "test"
state = "active"
owner = "cflmy"
scope = "可执行的独立公共协议测试"
requires = ["cli"]
checks_with = []
release = "none"
entry = "scripts/build_all.sh"

