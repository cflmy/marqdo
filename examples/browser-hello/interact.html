<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marqdo · 交互装配 (C3)</title>
  <style>
    :root {
      --ink: #1a1f1c;
      --paper: #e8efe6;
      --accent: #2f6f4e;
      --muted: #5a6b60;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 90% 0%, #cfe0d2 0%, transparent 50%),
        linear-gradient(165deg, #f3f7f2, var(--paper));
      padding: 2rem clamp(1rem, 4vw, 3rem);
    }
    h1 {
      font-family: "IBM Plex Serif", "Noto Serif SC", serif;
      font-weight: 600;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      margin: 0 0 0.35rem;
    }
    .lead { color: var(--muted); margin: 0 0 1.5rem; max-width: 36rem; }
    #count {
      font-family: "IBM Plex Serif", serif;
      font-size: 4rem;
      line-height: 1;
      margin: 1rem 0 1.25rem;
      letter-spacing: -0.04em;
    }
    button {
      margin-right: 0.5rem;
      padding: 0.55rem 1.1rem;
      border: 0;
      background: var(--accent);
      color: #f5faf6;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: #3a4740; }
    pre {
      margin-top: 1.5rem;
      width: min(40rem, 100%);
      padding: 0.9rem 1rem;
      background: #122018;
      color: #d7eadc;
      overflow: auto;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .err { color: #ffb4a8; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Marqdo</h1>
  <p class="lead">C3/D：GFM 交互表装配事件；官方 <code>mount</code> 自启，业务只在 <code>counter.mq.md</code>。<a href="./fetch.html">fetch</a> · <a href="./form.html">表单</a> · <a href="./">打印</a></p>
  <div id="count">0</div>
  <button id="bump" type="button" disabled>加一</button>
  <button id="reset" class="secondary" type="button" disabled>清零</button>
  <pre id="log">loading…</pre>
  <script
    type="module"
    src="./marqdo-bridge.js"
    data-mq-wasm="./marqdo_wasm.wasm"
    data-mq-source-url="./counter.mq.md"
    data-mq-ready="#log"
    data-mq-enable="#bump,#reset"
  ></script>
</body>
</html>
