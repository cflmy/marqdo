# Build and attach release binaries when a version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go (web plugin)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install Node (VS Code extension)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MinGW for cgo (web.dll)
        run: choco install mingw -y

      - name: Build release CLI + official plugins
        shell: bash
        run: |
          export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          cargo build --release
          cargo build --release -p marqdo_plugin_agent -p marqdo_plugin_quantum -p marqdo_plugin_linalg -p marqdo_plugin_llm
          bash ./scripts/build-web-plugin.sh

      - name: Checkout extension sources (branch vscode-extension only)
        run: git fetch origin vscode-extension && git checkout origin/vscode-extension -- vscode-extension

      - name: Build VSIX
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location vscode-extension
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies -o "../dist/marqdo-$ver.vsix"
          Pop-Location

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $target = "x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = "marqdo-$ver-$target.exe"
          $zip = "marqdo-$ver-$target.zip"
          $stdlib = "marqdo-$ver-stdlib.zip"
          $source = "marqdo-$ver-source.zip"
          $vsix = "marqdo-$ver.vsix"
          $public = "marqdo-$ver-public.zip"
          $extZip = "marqdo-$ver-ext.zip"
          $nativeZip = "marqdo-$ver-native-$target.zip"
          Copy-Item target/release/marqdo.exe "dist/$exe"
          git archive --format=zip -o "dist/$source" HEAD
          ./target/release/marqdo view output public -o public
          Compress-Archive -Path public/* -DestinationPath "dist/$public" -Force
          $stageExt = "dist/stage-ext"
          if (Test-Path $stageExt) { Remove-Item $stageExt -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageExt | Out-Null
          Copy-Item ext "$stageExt/ext" -Recurse
          if (Test-Path "dist/$extZip") { Remove-Item "dist/$extZip" -Force }
          Compress-Archive -Path "$stageExt/*" -DestinationPath "dist/$extZip" -Force
          # Prebuilt native plugins (no Rust required for `marqdo ext add`)
          $stageNative = "dist/stage-native"
          if (Test-Path $stageNative) { Remove-Item $stageNative -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stageNative/native" | Out-Null
          Copy-Item target/release/web.dll "$stageNative/native/web.dll"
          Copy-Item target/release/agent.dll "$stageNative/native/agent.dll"
          Copy-Item target/release/quantum.dll "$stageNative/native/quantum.dll"
          Copy-Item target/release/linalg.dll "$stageNative/native/linalg.dll"
          Copy-Item target/release/llm.dll "$stageNative/native/llm.dll"
          if (Test-Path "dist/$nativeZip") { Remove-Item "dist/$nativeZip" -Force }
          Compress-Archive -Path "$stageNative/*" -DestinationPath "dist/$nativeZip" -Force
          $stage = "dist/stage-bundle"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/marqdo.exe "$stage/marqdo.exe"
          Copy-Item lib "$stage/lib" -Recurse
          Copy-Item ext "$stage/ext" -Recurse
          New-Item -ItemType Directory -Force -Path "$stage/ext/native" | Out-Null
          Copy-Item target/release/web.dll "$stage/ext/native/web.dll"
          Copy-Item target/release/agent.dll "$stage/ext/native/agent.dll"
          Copy-Item target/release/quantum.dll "$stage/ext/native/quantum.dll"
          Copy-Item target/release/linalg.dll "$stage/ext/native/linalg.dll"
          Copy-Item target/release/llm.dll "$stage/ext/native/llm.dll"
          if (Test-Path "dist/$zip") { Remove-Item "dist/$zip" -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zip" -Force
          $stageLib = "dist/stage-stdlib"
          if (Test-Path $stageLib) { Remove-Item $stageLib -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageLib | Out-Null
          Copy-Item lib "$stageLib/lib" -Recurse
          if (Test-Path "dist/$stdlib") { Remove-Item "dist/$stdlib" -Force }
          Compress-Archive -Path "$stageLib/*" -DestinationPath "dist/$stdlib" -Force
          echo "EXE=$exe" >> $env:GITHUB_ENV
          echo "ZIP=$zip" >> $env:GITHUB_ENV
          echo "STDLIB=$stdlib" >> $env:GITHUB_ENV
          echo "VSIX=$vsix" >> $env:GITHUB_ENV
          echo "SOURCE=$source" >> $env:GITHUB_ENV
          echo "PUBLIC=$public" >> $env:GITHUB_ENV
          echo "EXT=$extZip" >> $env:GITHUB_ENV
          echo "NATIVE=$nativeZip" >> $env:GITHUB_ENV

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Marqdo ${{ github.ref_name }}

            ### 亮点 / Highlights
            - **v1.1.1**：AI 栈收口——llm `ask`/`stream`/`collect` · Metadata Binding · Skill Compilation + Adaptive Routing · MCP 客户端 + resume · 可选 `plugins/llm`
            - **v1.1.1**: AI stack — llm ask/stream/collect, Metadata Binding, Skill Compilation + Adaptive Routing, MCP client + resume, optional plugins/llm
            - **v1.1.0**：AI 原生闭环三件套——核心表面守卫 · 渐进式契约 + `marqdo check` · **MLSP for AI** · `run --json`
            - **v1.1.0**: AI-native loop — core-surface guard, progressive contracts + `marqdo check`, **MLSP for AI**, `run --json`
            - **v1.0.7**：WS/网络边界加固；`url_encode` `%20`
            - **v1.0.3**：Ubuntu PPA + 扩展 CDN（ext.marqdo.com）
            - **Linux 包必出**：`*-native-x86_64-unknown-linux-gnu.zip` + Linux CLI bundle
            - Details: [CHANGELOG](https://github.com/cflmy/marqdo/blob/main/CHANGELOG.md) · [mapping v0.3](https://github.com/cflmy/marqdo/blob/main/doc/design/markdown-mapping-v0.3.md)

            ### Downloads

            | Asset | Contents |
            |-------|----------|
            | `marqdo-*-windows-msvc.exe` | CLI with **embedded** official stdlib |
            | `marqdo-*-windows-msvc.zip` | `marqdo.exe` + `lib/` + `ext/`（含 native DLL） |
            | `marqdo-*-native-*.zip` | 预编译 `web`/`agent`/`quantum`/`linalg`/`llm`（Windows DLL + **Linux .so 必出**） |
            | `marqdo-*-unknown-linux-gnu.zip` | Linux CLI + `lib/` + `ext/` + native `.so` |
            | `marqdo-*-stdlib.zip` | `lib/` only |
            | `marqdo-*-ext.zip` | Official `ext/` L1 sources |
            | `marqdo-*-source.zip` | Source snapshot (`git archive`) |
            | `marqdo-*.vsix` | VS Code / Cursor extension |
            | `marqdo-*-public.zip` | Static user docs site |

            Extension workflow: [vscode-extension-commit.md](https://github.com/cflmy/marqdo/blob/main/doc/design/vscode-extension-commit.md)
          files: |
            dist/${{ env.EXE }}
            dist/${{ env.ZIP }}
            dist/${{ env.STDLIB }}
            dist/${{ env.EXT }}
            dist/${{ env.NATIVE }}
            dist/${{ env.VSIX }}
            dist/${{ env.SOURCE }}
            dist/${{ env.PUBLIC }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    # Wait until Windows has created the GitHub Release, then attach Linux zips
    # (required: native plugins for `marqdo ext add` on Linux + CLI bundle).
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go (web plugin)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install zip + cgo toolchain
        run: sudo apt-get update && sudo apt-get install -y zip gcc libc6-dev

      - name: Build Linux CLI + official plugins
        run: |
          set -euo pipefail
          cargo build --release
          cargo build --release -p marqdo_plugin_agent -p marqdo_plugin_quantum -p marqdo_plugin_linalg -p marqdo_plugin_llm
          bash ./scripts/build-web-plugin.sh

      - name: Package Linux native zip + CLI bundle
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          TARGET="x86_64-unknown-linux-gnu"
          mkdir -p dist/stage-native/native
          for lib in libweb.so libagent.so libquantum.so liblinalg.so libllm.so; do
            src="target/release/${lib}"
            if [[ ! -f "$src" && "$lib" == libweb.so ]]; then
              src="plugins/web/build/libweb.so"
            fi
            test -f "$src" || { echo "missing $src" >&2; exit 1; }
            cp "$src" "dist/stage-native/native/${lib}"
          done
          (cd dist/stage-native && zip -r "../marqdo-${VER}-native-${TARGET}.zip" .)
          echo "NATIVE=marqdo-${VER}-native-${TARGET}.zip" >> "$GITHUB_ENV"

          stage="dist/stage-linux"
          rm -rf "$stage"
          mkdir -p "$stage/ext/native" "$stage/lib"
          cp target/release/marqdo "$stage/marqdo"
          chmod +x "$stage/marqdo"
          cp -a lib/. "$stage/lib/"
          cp -a ext/. "$stage/ext/"
          cp dist/stage-native/native/*.so "$stage/ext/native/"
          linux_zip="marqdo-${VER}-${TARGET}.zip"
          (cd "$stage" && zip -r "../${linux_zip}" .)
          echo "LINUX_ZIP=${linux_zip}" >> "$GITHUB_ENV"

      - name: Upload Linux packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.NATIVE }}
            dist/${{ env.LINUX_ZIP }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
