# Independent extension sources and native libraries; no CLI/PPA publication.
name: Extension Release

on:
  push:
    tags:
      - "ext-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install cgo toolchain
        run: choco install mingw -y
      - name: Build the handbook CLI and native capabilities
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          cargo build --release -p marqdo -p marqdo_plugin_agent -p marqdo_plugin_quantum -p marqdo_plugin_linalg -p marqdo_plugin_llm -p marqdo_plugin_engineering
          bash scripts/build-web-plugin.sh
      - name: Build and validate the runner's exact pack bytes
        shell: pwsh
        run: ./target/release/marqdo.exe call skills/marqdo-release/packs.mq.md ci --effects plugin,fs.write,environment.read --fs-root . --require-ok --json
      - name: Attach source and Windows native packs without replacement
        shell: pwsh
        run: ./target/release/marqdo.exe call skills/marqdo-release/packs.mq.md attach_ci --effects plugin,fs.read,environment.read --fs-root . --require-ok --json

  linux:
    runs-on: ubuntu-latest
    needs: windows
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install ZIP and cgo tools
        run: sudo apt-get update && sudo apt-get install -y zip gcc libc6-dev
      - name: Build the handbook CLI and native capabilities
        run: |
          set -euo pipefail
          cargo build --release -p marqdo -p marqdo_plugin_agent -p marqdo_plugin_quantum -p marqdo_plugin_linalg -p marqdo_plugin_llm -p marqdo_plugin_engineering
          bash scripts/build-web-plugin.sh
      - name: Build and validate the runner's exact pack bytes
        run: target/release/marqdo call skills/marqdo-release/packs.mq.md ci --effects plugin,fs.write,environment.read --fs-root . --require-ok --json
      - name: Attach Linux native pack without replacement
        run: target/release/marqdo call skills/marqdo-release/packs.mq.md attach_ci --effects plugin,fs.read,environment.read --fs-root . --require-ok --json
