# Cargo feature compatibility gate.
#
# `sema` (the core compiler) must build without the `cli` feature. Library
# consumers such as qdagent depend on `marqdo` with `default-features = false`,
# so any unconditional reference to a `cli`-gated module is a release blocker.
# Keep this matrix in sync with the feature graph in Cargo.toml.
name: feature-matrix

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/feature-matrix.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/feature-matrix.yml"
  workflow_dispatch:

concurrency:
  group: feature-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lib-feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81.0
      - name: Library builds with no default features
        run: cargo check --locked --lib --no-default-features
      - name: Library builds with only the cli feature
        run: cargo check --locked --lib --no-default-features --features cli
      - name: Library builds with default features
        run: cargo check --locked --lib
