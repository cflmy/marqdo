name: native-ai-flow

on:
  push:
    branches:
      - feat/native-ai-flow-recovery-20261118
  pull_request:
    paths:
      - 'plugins/agent/**'
      - 'ext/ai/flow.mq.md'
      - 'ext/ai/context.mq.md'
      - 'ext/ai/recovery.mq.md'
      - 'ext/ai/workflow.mq.md'
      - 'tests/ext/ai-native-*.mq.md'
      - '.github/workflows/native-ai-flow.yml'

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the agent plugin
        run: cargo build -p marqdo_plugin_agent --locked
      - name: Run native agent and workflow tests
        run: cargo test -p marqdo_plugin_agent --locked
      - name: Check the public Marqdo ABI libraries
        run: |
          cargo run --locked -- check ext/ai/flow.mq.md
          cargo run --locked -- check ext/ai/context.mq.md
          cargo run --locked -- check ext/ai/recovery.mq.md
          cargo run --locked -- check ext/ai/workflow.mq.md
          cargo run --locked -- check tests/ext/ai-native-flow.mq.md
          cargo run --locked -- check tests/ext/ai-native-workflow.mq.md
      - name: Exercise offline integration through Marqdo
        env:
          MARQDO_AGENT_PLUGIN: ${{ github.workspace }}/target/debug/libagent.so
        run: |
          cargo run --locked -- run tests/ext/ai-native-flow.mq.md
          cargo run --locked -- run tests/ext/ai-native-workflow.mq.md
