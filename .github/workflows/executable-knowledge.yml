name: executable-knowledge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build agent + llm plugins (EK / workbench gates)
        run: |
          cargo build -p marqdo_plugin_agent --locked
          cargo build -p marqdo_plugin_llm --locked
      - name: Native agent choice and bounded recovery unit tests
        run: cargo test -p marqdo_plugin_agent --locked
      - name: Check short AI flow documents
        run: |
          cargo run --locked -- check ext/ai/flow.mq.md
          cargo run --locked -- check ext/ai/recovery.mq.md
          cargo run --locked -- check ext/ai/context.mq.md
          cargo run --locked -- check tests/ext/ai-native-flow.mq.md
          cargo run --locked -- check ext/ai/workflow.mq.md
          cargo run --locked -- check tests/ext/ai-native-workflow.mq.md
      - name: Native AI flow interpreter smoke (offline)
        env:
          MARQDO_AGENT_PLUGIN: ${{ github.workspace }}/target/debug/libagent.so
        run: |
          cargo run --locked -- run tests/ext/ai-native-flow.mq.md
          cargo run --locked -- run tests/ext/ai-native-workflow.mq.md
      - name: Workbench contracts (M00–M06 / F-subset)
        run: cargo test --test workbench_contracts --locked
      - name: Offline executable-knowledge gate
        run: cargo test --test executable_knowledge --locked
      - name: Isolated execute MR-01 (dual 60s SSE + short reads)
        run: |
          cargo build -p marqdo_plugin_llm --locked
          bash scripts/build-web-plugin.sh
          cargo test --test isolated_execute_mr01 --locked -- --nocapture
        timeout-minutes: 5
      - name: no ignored tests counted as success
        run: |
          if grep -n '#\[ignore\]' tests/executable_knowledge.rs; then
            echo "executable_knowledge must not use #[ignore] as success evidence" >&2
            exit 1
          fi
          echo "ok: no #[ignore] in executable_knowledge gate"
