name: knowledge-proof-integration
on:
  pull_request:
    paths:
      - "src/sema/ir.rs"
      - "src/knowledge/**"
      - "src/prove/**"
      - "tests/knowledge_proof.rs"
      - ".github/workflows/knowledge-proof.yml"
  workflow_dispatch:

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile tests and run semantic anchor unit cases
        run: cargo test --locked --lib sema::ir::tests -- --nocapture
      - name: Knowledge / proof linkage tests
        run: cargo test --locked --test knowledge_proof -- --nocapture
      - name: Existing proof contracts
        run: cargo test --locked --test prove
      - name: Executable knowledge compatibility
        run: cargo test --locked --test executable_knowledge
