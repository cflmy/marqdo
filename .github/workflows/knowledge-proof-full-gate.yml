name: knowledge-proof-full-gate

on:
  pull_request:
    paths:
      - "src/knowledge/**"
      - "src/sema/**"
      - "src/prove/**"
      - "tests/**"
      - "doc/verification/skill-proof/**"
      - ".github/workflows/knowledge-proof-full-gate.yml"
  workflow_dispatch:

concurrency:
  group: knowledge-proof-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  complete-proof-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Lean kernel
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Validate Lean kernel and embedded proof library
        run: |
          lean --version
          bash scripts/check-proof-library.sh
          lean doc/verification/skill-proof/MarqdoModularProof.lean
          lean doc/verification/skill-proof/MarqdoEffects.lean
      - name: Build and run all knowledge unit tests
        run: |
          cargo build --locked
          cargo test --locked --lib knowledge::
          cargo test --locked --lib sema::ir::tests
      - name: Knowledge and execution compatibility suites
        run: |
          cargo test --locked --test knowledge_proof
          cargo test --locked --test executable_knowledge
          cargo test --locked --test prove
      - name: Full genuine Lean proof matrix
        env:
          MARQDO_PROOF_REQUIRE_LEAN: "1"
        run: |
          cargo test --locked --test prove_lean
          cargo test --locked --test prove_corpus
          cargo test --locked --test conformance
