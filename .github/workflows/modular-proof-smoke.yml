name: modular-proof-smoke
on:
  pull_request:
    paths:
      - "src/knowledge/**"
      - "src/sema/ir.rs"
      - "src/prove/**"
      - "tests/prove_lean.rs"
      - "doc/verification/skill-proof/**"
      - ".github/workflows/modular-proof-smoke.yml"
  workflow_dispatch:
concurrency:
  group: modular-proof-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  modular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile isolated modular proof candidates
        run: cargo test --locked --lib knowledge::composition::tests -- --nocapture
      - name: Compile parameter-projection proof backend
        run: cargo test --locked --lib knowledge::projection -- --nocapture
      - name: Compile pure-expression VC backend
        run: cargo test --locked --lib knowledge::expression::tests -- --nocapture
      - name: Compile path-sensitive VCs
        run: cargo test --locked --lib knowledge::symbolic::tests -- --nocapture
      - name: Compile closed-argument VCs
        run: cargo test --locked --lib knowledge::vc::tests -- --nocapture
      - name: Install Lean 4.35
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean proof of exception, ABI and fuel-bound models
        run: |
          lean doc/verification/skill-proof/MarqdoModularProof.lean
          lean doc/verification/skill-proof/MarqdoEffects.lean
      - name: Independently composed Lean modules
        env:
          MARQDO_PROOF_REQUIRE_LEAN: "1"
        run: cargo test --locked --test prove_lean composition_emits_independently_replayable_caller_certificate -- --nocapture
      - name: Symbolic parameter projection with independent Lean replay
        env:
          MARQDO_PROOF_REQUIRE_LEAN: "1"
        run: cargo test --locked --test prove_lean projection_composition_proves_symbolic_caller_and_replays_from_source -- --nocapture
      - name: Independent arithmetic contract composition with real Lean
        env:
          MARQDO_PROOF_REQUIRE_LEAN: "1"
        run: cargo test --locked --test prove_lean pure_expression_composition_proves_and_replays_real_lean -- --nocapture
      - name: Regenerated provenance for original Lean certificates
        env:
          MARQDO_PROOF_REQUIRE_LEAN: "1"
        run: cargo test --locked --test prove_lean g2_certificate_hit_after_real_run -- --nocapture
      - name: Linear symbolic arithmetic path implication with real Lean
        env:
          MARQDO_PROOF_REQUIRE_LEAN: "1"
        run: cargo test --locked --test prove_lean arithmetic_symbolic_path_implication_uses_real_lean -- --nocapture
      - name: Symbolic path implication with real Lean
        env:
          MARQDO_PROOF_REQUIRE_LEAN: "1"
        run: cargo test --locked --test prove_lean symbolic_path_implication_uses_real_lean_without_runtime_promotion -- --nocapture
