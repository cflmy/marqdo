when:
  - event: [pull_request, manual]
  - event: push
    branch: main

steps:
  layout:
    image: git.cflmy.cn/cflmy/marqdo-ci-shell:3.0.0-rc.5@sha256:8184439a201da451271f37596f4e38afeab16e044d7591853779887ef5ec28c1
    commands:
      - python3 scripts/check-layout.py
      - python3 -m unittest discover -s tests/integration

  checkouts:
    image: git.cflmy.cn/cflmy/marqdo-ci-shell:3.0.0-rc.5@sha256:8184439a201da451271f37596f4e38afeab16e044d7591853779887ef5ec28c1
    depends_on: [layout]
    when: &needs_candidate
      - event: manual
      - event: [push, pull_request]
        path:
          # Governance, executable Markdown, packaging and unknown paths stay in scope.
          exclude: [README.md, 'docs/evidence/*.md']
          on_empty: true
    commands:
      - git submodule update --init
      - |
        set -eu
        domains="$(python3 scripts/check-layout.py --domain-paths)"
        for domain in $domains; do
          git -C "$domain" submodule update --init
        done
      - python3 scripts/check-layout.py --checkouts
      - python3 scripts/check-repo-conventions.py

  candidate:
    # Match the Linux/glibc environment already used by View for the RC.4 artifact.
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    depends_on: [checkouts]
    when: *needs_candidate
    commands:
      - |
        set -eu
        for attempt in 1 2 3; do
          if apt-get -o Acquire::By-Hash=force -o Acquire::Retries=3 update --error-on=any; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep 15
        done
        apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates curl git python3 python3-jsonschema build-essential
        curl -fsSL --retry 3 https://sh.rustup.rs -o /tmp/marqdo-rustup.sh
        sh /tmp/marqdo-rustup.sh -y --profile minimal --default-toolchain 1.100.0 --no-modify-path
        export PATH="$HOME/.cargo/bin:$PATH"
        bash scripts/integration.sh
