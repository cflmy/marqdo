when:
  - event: [pull_request, manual]
  - event: push
    branch: main

steps:
  layout:
    image: git.cflmy.cn/cflmy/marqdo-ci-shell:3.0.0-rc.5@sha256:8184439a201da451271f37596f4e38afeab16e044d7591853779887ef5ec28c1
    commands:
      - python3 scripts/check-layout.py
      - python3 -m unittest discover -s tests/integration

  checkouts:
    image: git.cflmy.cn/cflmy/marqdo-ci-shell:3.0.0-rc.5@sha256:8184439a201da451271f37596f4e38afeab16e044d7591853779887ef5ec28c1
    depends_on: [layout]
    when: &needs_candidate
      - event: manual
      - event: [push, pull_request]
        path:
          # Governance, executable Markdown, packaging and unknown paths stay in scope.
          exclude: [README.md, 'docs/evidence/*.md']
          on_empty: true
    commands:
      - git submodule update --init
      - |
        set -eu
        domains="$(python3 scripts/check-layout.py --domain-paths)"
        for domain in $domains; do
          git -C "$domain" submodule update --init
        done
      - python3 scripts/check-layout.py --checkouts
      - python3 scripts/check-repo-conventions.py

  candidate:
    image: git.cflmy.cn/cflmy/marqdo-ci-rust:3.0.0-rc.5@sha256:73481a35339157b1a3f3b23076517e96e302fbb5158e6ffcb1582acf22c6af94
    depends_on: [checkouts]
    when: *needs_candidate
    commands:
      - |
        set -eu
        for attempt in 1 2 3; do
          if apt-get -o Acquire::By-Hash=force -o Acquire::http::Timeout=30 update --error-on=any; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep 15
        done
        apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3-jsonschema util-linux
        unset MARQDO_BIN MARQDO_STDLIB_DIR
        bash scripts/integration.sh
