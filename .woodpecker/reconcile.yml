# Release discovery, asset verification and tracking-Issue reconciliation.
#
# Runs only from the protected default branch, on a manual trigger or the
# `release-reconcile` cron. The fast path (component release workflows) only
# asks this same workflow to run; correctness comes from this reconcile.
when:
  event: [manual, cron]
  branch: [main]

concurrency: 1

steps:
  reconcile:
    image: git.cflmy.cn/cflmy/marqdo-ci-shell:3.0.0-rc.5@sha256:8184439a201da451271f37596f4e38afeab16e044d7591853779887ef5ec28c1
    environment:
      MARQDO_GIT_TOKEN:
        from_secret: gitea_reconcile_token
    commands:
      - |
        set -eu
        domains="$(python3 scripts/check-layout.py --root-domain-paths)"
        for domain in $domains; do
          git submodule update --init -- "$domain"
        done
      - python3 scripts/check-layout.py --domain-paths
      - python3 scripts/reconcile-releases.py --apply --published-after 2026-11-27T02:00:00Z --report-out reconcile-report.json
